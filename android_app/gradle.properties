# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.enableJetifier=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false

# Force Gradle to use the Android Studio bundled JDK
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

# Enable Toolchain auto-download so Gradle can fetch JDK 17 if not found
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true

# Explicitly point to the valid JDK
org.gradle.java.installations.paths=C\:\\Program Files\\Android\\Android Studio\\jbr

# Disable configuration cache to clear stale paths
org.gradle.configuration-cache=false